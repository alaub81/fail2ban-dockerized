name: Release (build, scan, push)

"on":
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      rebuild_tags:
        description: "Rebuild last N tags (true/false)"
        required: false
        default: "false"
  schedule:
    - cron: "17 01 * * 2"

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- (A) TAG-REBUILD: cron oder manuell (rebuild_tags=true) ---
  rebuild-released-tags:
    if: ${{ github.event_name == 'schedule' || inputs.rebuild_tags == 'true' }}
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/alaub81/fail2ban-dockerized
      NUM_TAGS: "3"
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        run: |
          set -euo pipefail
          TAGS="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n "${NUM_TAGS}")"
          echo "Selected tags:"
          printf '%s\n' "$TAGS"
          echo "matrix=$(printf '%s\n' "$TAGS" | jq -R . | jq -s .)" >> "$GITHUB_OUTPUT"

  rebuild-each-tag:
    needs: rebuild-released-tags
    if: ${{ needs.rebuild-released-tags.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.rebuild-released-tags.outputs.matrix) }}
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tag }}
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (reuse exact tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Pre-build (amd64) für Scan
      - name: Build (scan image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-fail2ban
          pull: true
          push: false
          load: true
          platforms: linux/amd64
          tags: f2b-scan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy Scans (FS + Image) mit eindeutigen Kategorien
      - name: Trivy FS (SARIF)
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Upload FS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs-rebuild

      - name: Trivy Image (gate)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: f2b-scan:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Build & Push (multi-arch, overwrite tag)
        if: ${{ success() }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-fail2ban
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- (B) KLASSISCHER RELEASE: nur bei TAG-PUSH ---
  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Pre-build (amd64) zum Scannen
      - name: Pre-build (load for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-fail2ban
          push: false
          pull: true
          load: true
          platforms: linux/amd64
          tags: fail2ban-scan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy Image: SARIF + Gate
      - name: Trivy Image (SARIF)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: fail2ban-scan:${{ github.sha }}
          format: sarif
          output: trivy-release.sarif
          exit-code: "0"
          hide-progress: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-release.sarif
          category: trivy-release
      - name: Trivy Image (enforce severity)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: fail2ban-scan:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (semver + latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alaub81/fail2ban-dockerized
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=fail2ban-dockerized
            org.opencontainers.image.source=${{ github.repository }}

      - name: Build & Push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-fail2ban
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
